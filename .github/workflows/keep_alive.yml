name: Keep Streamlit Apps Alive 24/7

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install chromium

      - name: Ping & Wake Streamlit Apps
        run: |
          python - << 'EOF'
          from playwright.sync_api import sync_playwright

          URLS = [
              "https://upvideo.streamlit.app/",
              "https://locketvantruong.streamlit.app/",
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(viewport={"width": 1280, "height": 800})
              for url in URLS:
                  page = context.new_page()
                  try:
                      print(f"Visiting: {url}")
                      page.goto(url, wait_until="domcontentloaded", timeout=45000)
                      page.wait_for_timeout(10000)
                      wake_btn = page.locator("button:has-text('Yes, get this app back up'), button:has-text('Wake up')")
                      if wake_btn.count() > 0:
                          print(f"Waking sleeping app: {url}")
                          wake_btn.first.click()
                          page.wait_for_timeout(25000)
                      print(f"Done: {url} | Title: {page.title()}")
                  except Exception as e:
                      print(f"Warning on {url}: {e}")
                  finally:
                      page.close()
              browser.close()
          EOF

      - name: Keep Cron Active (Auto Commit Monthly)
        run: |
          DAY=$(date -u +%d)
          if [ "$DAY" = "01" ] || [ "$DAY" = "15" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            date -u +"Last keep-alive: %Y-%m-%d %H:%M:%S UTC" > last_ping.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_ping.txt
            git commit -m "chore: keep-alive heartbeat" || true
            git push || true
          fi
